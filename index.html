<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="C.E.L.I.A.: veja como estão as calçadas no caminho até o trabalho antes de sair de casa." />
    <title>C.E.L.I.A.</title>

    <!-- Lexend: fonte criada para facilitar a leitura -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap"
    />

    <!--
      Aplica o tema e os ajustes de acessibilidade salvos ANTES do React carregar,
      para a tela não "piscar" clara nem mudar de tamanho depois de aparecer.
    -->
    <script>
      try {
        var raiz = document.documentElement;
        var salvo = localStorage.getItem('celia-tema');
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        raiz.dataset.tema = salvo || (escuro ? 'escuro' : 'claro');

        var ajustes = JSON.parse(localStorage.getItem('celia-acessibilidade')) || {};
        raiz.dataset.texto = ajustes.texto || 'normal';
        raiz.dataset.movimento = ajustes.menosMovimento ? 'reduzido' : 'normal';
        raiz.dataset.contraste = ajustes.maisContraste ? 'alto' : 'normal';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

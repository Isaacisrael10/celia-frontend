<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="C.E.L.I.A.: veja como estão as calçadas no caminho até o trabalho antes de sair de casa." />
    <title>C.E.L.I.A.</title>

    <!-- Atkinson Hyperlegible: fonte criada para pessoas com baixa visão -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    />

    <!-- Aplica o tema salvo antes do React carregar, para a tela não "piscar" clara -->
    <script>
      try {
        var salvo = localStorage.getItem('celia-tema');
        var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.tema = salvo || (escuro ? 'escuro' : 'claro');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
